name: Kubernetes

on:
  push:
    branches: [main]
    paths:
      - "deploy/kubernetes/**"
      - ".github/workflows/kubernetes.yml"
  pull_request:
    branches: [main]
    paths:
      - "deploy/kubernetes/**"
      - ".github/workflows/kubernetes.yml"

jobs:
  validate:
    name: Validate Kubernetes manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Render manifests
        run: kubectl kustomize deploy/kubernetes > /tmp/agent-builder.yaml

      - name: Validate required workload objects
        run: |
          grep -q "kind: Namespace" /tmp/agent-builder.yaml
          grep -q "kind: Deployment" /tmp/agent-builder.yaml
          grep -q "kind: Service" /tmp/agent-builder.yaml
          grep -q "kind: Ingress" /tmp/agent-builder.yaml
          grep -q "name: agent-builder" /tmp/agent-builder.yaml
